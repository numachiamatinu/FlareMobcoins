#  Flare Mobcoins · menu 'confirm' (opens before a purchase with confirm: true or above shop.confirm-above)
#  In-game: /mobcoins editor confirm   (drag & drop · close = save)
#
#  enabled         false = products are bought at once, without this menu
#  rows            size of the menu: 1-6 rows (9-54 slots)
#  slots           "4"  "19-25"  "0-8,45-53"   (row 1 = 0-8, row 2 = 9-17 ...)
#  material        DIAMOND · head:{player} · head:Notch · texture:<minecraft-heads value>
#  admin-only      true = players don't see it
#  product         the product being bought is shown here
#  Placeholders    {product} {price} and the ones of the product
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#f7c948Text"   Gradient "<gradient:#f7b733:#fce38a>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

enabled: true
title: "<gradient:#f7b733:#fce38a><bold>CONFIRM</bold></gradient>"
rows: 3
open-commands: []
open-permission: ""
elements:
  product:
    slots: "13"
    admin-only: false
  confirm:
    slots: "10-12"
    admin-only: false
    material: "LIME_STAINED_GLASS_PANE"
    name: "&a&lConfirm"
    lore:
      - "&7Buy {product}"
      - "&7for &#f7c948{price} mobcoins"
  cancel:
    slots: "14-16"
    admin-only: false
    material: "RED_STAINED_GLASS_PANE"
    name: "&c&lCancel"
    lore:
      - "&7Back to the shop"
decorations:
  - slots: "0-9,17-26"
    material: "YELLOW_STAINED_GLASS_PANE"
    name: " "
    lore: []
    glow: false
    admin-only: false
    actions: []
