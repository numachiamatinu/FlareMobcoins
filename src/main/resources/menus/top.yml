#  Flare Mobcoins · menu 'top' (/mobcoins top, "/mobcoins top chat" = the list in chat)
#  In-game: /mobcoins editor top   (drag & drop · close = save)
#
#  enabled         false = menu off for everyone (/mobcoins top writes the list in chat)
#  rows            size of the menu: 1-6 rows (9-54 slots)
#  open-commands   [baltop] → /baltop opens it   ·   open-permission: "" = everyone
#  slots           "4"  "19-25"  "0-8,45-53"   (row 1 = 0-8, row 2 = 9-17 ...)
#  material        DIAMOND · head:{player} · head:Notch · texture:<minecraft-heads value>
#  admin-only      true = players don't see it
#  actions         [close] [back] [open] <menu> [player] cmd [console] cmd [message] text [sound] key
#  entries         one slot per player of the top list (top.size in config.yml)
#  all-time, weekly, monthly   show the balances / the mobcoins from mobs of this week / month (the shown one shines)
#  stats           closes the menu and shows /mobcoins stats
#  Placeholders    entries: {position} {name} {amount} {amount_commas} {amount_formatted} {mode} (texts > modes)
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#f7c948Text"   Gradient "<gradient:#f7b733:#fce38a>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

enabled: true
title: "<gradient:#f7b733:#fce38a><bold>TOP MOBCOINS</bold></gradient>"
rows: 5
open-commands: []
open-permission: ""
elements:
  entries:
    slots: "11-15,20-24"
    admin-only: false
    material: "head:{name}"
    name: "&#f7c948#{position} &f{name}"
    lore:
      - "&7{mode}: &f{amount_commas}"
  all-time:
    slots: "38"
    admin-only: false
    material: "GOLD_INGOT"
    name: "&#f7c948All time"
    lore:
      - "&7Who has the most mobcoins"
  weekly:
    slots: "39"
    admin-only: false
    material: "CLOCK"
    name: "&#f7c948This week"
    lore:
      - "&7Most mobcoins from mobs"
      - "&7since Monday"
  back:
    slots: "40"
    admin-only: false
    material: "ARROW"
    name: "&c← Back"
    lore: []
  monthly:
    slots: "41"
    admin-only: false
    material: "DIAMOND"
    name: "&#f7c948This month"
    lore:
      - "&7Most mobcoins from mobs"
      - "&7this month"
  stats:
    slots: "42"
    admin-only: false
    material: "BOOK"
    name: "&#f7c948Your stats"
    lore:
      - "&7Kills, best combo, boosters"
decorations:
  - slots: "0-9,17,18,26,27,35-37,43,44"
    material: "YELLOW_STAINED_GLASS_PANE"
    name: " "
    lore: []
    glow: false
    admin-only: false
    actions: []

# ── Texts of this menu ──
texts:
  empty:
    material: "BARRIER"
    name: "&7Nobody has mobcoins yet"
    lore: []
  period-empty:
    material: "BARRIER"
    name: "&7Nobody got mobcoins from mobs yet"
    lore: []
  modes:
    balance: "MobCoins"
    weekly: "This week"
    monthly: "This month"
