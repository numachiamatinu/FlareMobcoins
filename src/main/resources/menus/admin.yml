#  Flare Mobcoins · texts of the admin menus (/mobcoins settings and the editor)
#  Player menu texts are in menus/*.yml and shops/*.yml (section "texts")
#  Chat messages are in lang/en.yml   ·   after editing: /mobcoins reload
#  Placeholders {value} {menu} ... are filled by the plugin, keep them.
#
#  ── Format ──────────────────────────────────────────────
#  Colors    &a &c &e &f &7 ...   &l bold  &o italic  &n underline
#  Hex       "&#f7c948Text"
#  Gradient  "<gradient:#f7b733:#fce38a>Text</gradient>"   Rainbow "<rainbow>Text</rainbow>"
#  Tip       always write texts between "quotes"

